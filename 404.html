<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost past the horizon · yDkay</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030304">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #030304; color: #ece8e1; }
  body {
    display: grid; place-items: center; text-align: center; padding: 2rem;
    font: 400 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .hole {
    width: min(56vmin, 22rem); aspect-ratio: 2 / 1; margin: 0 auto 2.5rem;
    background:
      radial-gradient(circle at 50% 50%, #000 0 18%, transparent 18.6%),
      radial-gradient(circle at 50% 50%, rgba(255, 214, 170, .95) 19%, rgba(255, 140, 60, .35) 23%, transparent 31%),
      radial-gradient(ellipse 50% 12% at 50% 50%, rgba(255, 170, 90, .6), rgba(140, 40, 10, .25) 62%, transparent 74%);
  }
  .code { font: .75rem ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; color: #a39f97; margin: 0; }
  h1 { font: 400 clamp(2rem, 6vw, 3.4rem)/1.08 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: -.02em; margin: .8rem 0 1rem; }
  p { margin: 0 auto; max-width: 30rem; color: #a39f97; }
  a { color: #ffb877; }
  a:focus-visible { outline: 2px solid #ffb877; outline-offset: 4px; }
  .home { display: inline-block; margin-top: 2rem; font: .8rem ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
  .pt { margin-top: .6rem; font-size: .9rem; }
  footer { margin-top: 3rem; font: .7rem ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; color: #8a867f; }
</style>
</head>
<body>
  <main>
    <div class="hole" aria-hidden="true"></div>
    <p class="code">404 · r &lt; 1 r<sub>s</sub></p>
    <h1>This page fell past the horizon.</h1>
    <p>Nothing comes back from there. The rest of the site is still in orbit.</p>
    <p class="pt" lang="pt-BR">Esta página caiu além do horizonte. O resto do site continua em órbita.</p>
    <a class="home" href="/">Return to orbit</a>
    <footer>YDKAY TECHNOLOGIES LTDA · Cascavel, Brazil</footer>
  </main>
</body>
</html>
